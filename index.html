<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#8B0000" />
  <title>Aravindan · Product Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --crimson: #8b0000;
      --scarlet: #dc143c;
      --ember: #ff4d5a;
      --ink: #0c0b0b;
      --panel: #161313;
      --elevated: #1f1a1a;
      --line: rgba(255, 214, 214, 0.12);
      --text: #f6f1ee;
      --muted: #b9a8a4;
      --glass: rgba(22, 19, 19, 0.62);
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      --radius: 18px;
      --nav-h: 72px;
      --font-display: "Poppins", system-ui, sans-serif;
      --font-body: "Inter", system-ui, sans-serif;
      color-scheme: dark;
    }
    body.theme-light {
      --ink: #f7f2ef;
      --panel: #fffdfa;
      --elevated: #ffffff;
      --line: rgba(139, 0, 0, 0.14);
      --text: #1a1212;
      --muted: #6d5c58;
      --glass: rgba(255, 253, 250, 0.7);
      --shadow: 0 18px 40px rgba(90, 20, 20, 0.12);
      color-scheme: light;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: var(--font-body); background: var(--ink); color: var(--text); line-height: 1.6; overflow-x: hidden; }
    img { max-width: 100%; height: auto; display: block; }
    a { color: inherit; }
    .container { width: min(1120px, calc(100% - 2.4rem)); margin-inline: auto; }
    .site-header { position: fixed; inset: 0 0 auto; z-index: 50; backdrop-filter: blur(16px); background: color-mix(in srgb, var(--ink) 78%, transparent); border-bottom: 1px solid var(--line); }
    .nav { width: min(1120px, calc(100% - 2.4rem)); margin: 0 auto; min-height: var(--nav-h); display: flex; align-items: center; gap: 1rem; }
    .logo { display: flex; align-items: center; gap: 0.65rem; text-decoration: none; font-family: var(--font-display); font-weight: 700; }
    .logo-mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: linear-gradient(145deg, var(--scarlet), var(--crimson)); color: #fff; box-shadow: 0 8px 20px rgba(220, 20, 60, 0.35); }
    .nav-menu { margin: 0 0 0 auto; padding: 0; list-style: none; display: flex; gap: 1.4rem; }
    .nav-menu a { text-decoration: none; font-size: 0.92rem; color: var(--muted); position: relative; }
    .nav-menu a:hover, .nav-menu a.is-active { color: var(--text); }
    .nav-menu a.is-active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 2px; background: var(--scarlet); }
    .nav-toggle { display: none; margin-left: auto; width: 42px; height: 42px; border: 1px solid var(--line); background: transparent; border-radius: 10px; flex-direction: column; justify-content: center; align-items: center; gap: 5px; cursor: pointer; }
    .nav-toggle-bar { display: block; width: 18px; height: 2px; background: var(--text); transition: transform 0.25s ease, opacity 0.2s ease; }
    .nav-toggle.is-open .nav-toggle-bar:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-toggle.is-open .nav-toggle-bar:nth-child(2) { opacity: 0; }
    .nav-toggle.is-open .nav-toggle-bar:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .theme-toggle { border: 1px solid var(--line); background: var(--elevated); color: var(--text); width: 42px; height: 42px; border-radius: 12px; cursor: pointer; display: grid; place-items: center; }
    body:not(.theme-light) .icon-sun, body.theme-light .icon-moon { display: none; }
    .hero { position: relative; min-height: 100vh; padding: calc(var(--nav-h) + 4rem) 0 5rem; overflow: hidden; }
    .hero-glow { position: absolute; width: 52vw; height: 52vw; right: -8vw; top: -10vw; background: radial-gradient(circle, rgba(220, 20, 60, 0.28), transparent 62%); pointer-events: none; }
    .hero-grid { display: grid; grid-template-columns: 1.3fr 0.7fr; gap: 3rem; align-items: center; }
    .eyebrow { letter-spacing: 0.16em; text-transform: uppercase; font-size: 0.72rem; color: var(--ember); font-weight: 600; }
    .hero-title { font-family: var(--font-display); font-size: clamp(2.4rem, 5vw, 4.4rem); line-height: 1.08; margin: 0.4rem 0 1rem; letter-spacing: -0.03em; }
    .accent { background: linear-gradient(90deg, var(--ember), var(--scarlet)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero-tagline { color: var(--muted); font-size: 1.05rem; max-width: 38rem; }
    .typed-line { display: block; margin-top: 0.7rem; color: var(--text); font-weight: 500; }
    .caret { color: var(--scarlet); animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 0.8rem; margin: 1.8rem 0 2.2rem; }
    .btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; border: 0; cursor: pointer; font: 600 0.95rem var(--font-display); padding: 0.85rem 1.25rem; border-radius: 999px; transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: linear-gradient(180deg, var(--scarlet), var(--crimson)); color: #fff; box-shadow: 0 12px 28px rgba(139, 0, 0, 0.38); }
    .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    .hero-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; margin: 0; }
    .hero-stats dt { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; }
    .hero-stats dd { margin: 0; color: var(--muted); font-size: 0.86rem; }
    .glass { background: var(--glass); border: 1px solid var(--line); box-shadow: var(--shadow); backdrop-filter: blur(18px); }
    .hero-panel { padding: 1.8rem; border-radius: var(--radius); }
    .panel-kicker { margin: 0 0 0.4rem; color: var(--ember); font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; }
    .hero-panel h2 { font-family: var(--font-display); margin: 0 0 0.6rem; font-size: 1.35rem; }
    .panel-tags, .tech, .socials, .icon-grid { display: flex; flex-wrap: wrap; gap: 0.45rem; padding: 0; list-style: none; }
    .panel-tags li, .tech li, .icon-grid li { border: 1px solid var(--line); border-radius: 999px; padding: 0.25rem 0.7rem; font-size: 0.78rem; color: var(--muted); }
    .section { padding: 5.5rem 0; }
    .section-title { font-family: var(--font-display); font-size: clamp(1.8rem, 3vw, 2.6rem); margin: 0.3rem 0 0.8rem; letter-spacing: -0.02em; }
    .section-lead { color: var(--muted); max-width: 40rem; }
    .about-grid, .contact-grid, .skills-layout { display: grid; gap: 2.5rem; }
    .about-grid { grid-template-columns: 0.85fr 1.15fr; align-items: center; }
    .portrait { margin: 0; }
    .portrait-art { width: 100%; aspect-ratio: 4/5; border-radius: 24px; box-shadow: var(--shadow); background: linear-gradient(160deg, #2a1216, #8b0000); display: grid; place-items: end center; padding-bottom: 1.2rem; color: #fff; font-size: 0.9rem; }
    .portrait figcaption { margin-top: 0.7rem; color: var(--muted); font-size: 0.88rem; }
    .about-points { padding-left: 1.1rem; color: var(--muted); }
    .filters { display: flex; flex-wrap: wrap; gap: 0.55rem; margin: 1.6rem 0 2rem; }
    .filter-btn { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 0.45rem 0.9rem; cursor: pointer; font: 500 0.86rem var(--font-body); }
    .filter-btn.is-active, .filter-btn:hover { background: var(--crimson); color: #fff; border-color: var(--crimson); }
    .project-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem; }
    .project-card { background: var(--elevated); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.25s ease, box-shadow 0.25s ease; }
    .project-card:hover { transform: translateY(-6px); box-shadow: var(--shadow); }
    .project-card.is-hidden { display: none; }
    .thumb { display: block; overflow: hidden; }
    .thumb-art { width: 100%; aspect-ratio: 16/10; display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-weight: 600; letter-spacing: 0.04em; }
    .t1 { background: linear-gradient(135deg, #14090b, #8b0000); }
    .t2 { background: linear-gradient(135deg, #10080a, #dc143c); }
    .t3 { background: linear-gradient(135deg, #1a0c0f, #5a1020); }
    .t4 { background: linear-gradient(135deg, #0e1a28, #8b0000); }
    .t5 { background: linear-gradient(135deg, #12100f, #3a1c22); }
    .t6 { background: linear-gradient(135deg, #140d12, #dc143c); }
    .card-body { padding: 1.1rem 1.15rem 1.25rem; display: flex; flex-direction: column; gap: 0.55rem; flex: 1; }
    .card-body h3 { margin: 0; font-family: var(--font-display); }
    .card-body p { margin: 0; color: var(--muted); font-size: 0.92rem; }
    .card-links { display: flex; gap: 1rem; margin-top: auto; padding-top: 0.5rem; }
    .card-links a { color: var(--ember); font-size: 0.88rem; font-weight: 600; text-decoration: none; }
    .skills-layout { grid-template-columns: 1.1fr 0.9fr; }
    .skill-bars, .skill-grid { padding: 1.4rem; border-radius: var(--radius); }
    .skill-grid { border: 1px solid var(--line); background: var(--elevated); }
    .bar + .bar { margin-top: 1rem; }
    .bar-label { display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 0.4rem; }
    .bar-track { height: 8px; background: color-mix(in srgb, var(--text) 10%, transparent); border-radius: 99px; overflow: hidden; }
    .bar-fill { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--crimson), var(--ember)); transition: width 1.1s ease; }
    .icon-grid li { background: var(--panel); }
    .contact-grid { grid-template-columns: 0.9fr 1.1fr; }
    .email-line { font-size: 1.1rem; }
    .email-line a { display: block; color: var(--ember); text-decoration: none; font-weight: 600; }
    .socials a { text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 0.35rem 0.85rem; }
    .contact-form { padding: 1.4rem; border-radius: var(--radius); display: grid; gap: 0.85rem; }
    .field label { display: block; font-size: 0.82rem; margin-bottom: 0.3rem; color: var(--muted); }
    .field input, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 12px; padding: 0.75rem 0.85rem; font: 400 1rem var(--font-body); }
    .field-error { min-height: 1.1rem; margin: 0.25rem 0 0; color: var(--ember); font-size: 0.78rem; }
    .form-status { margin: 0; font-size: 0.9rem; }
    .form-status.is-success { color: #7dffa3; }
    body.theme-light .form-status.is-success { color: #0f6b38; }
    .site-footer { border-top: 1px solid var(--line); padding: 1.4rem 0 2rem; color: var(--muted); font-size: 0.9rem; }
    .footer-row { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .back-to-top { position: fixed; right: 1.2rem; bottom: 1.2rem; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--crimson); color: #fff; cursor: pointer; opacity: 0; pointer-events: none; }
    .back-to-top.is-visible { opacity: 1; pointer-events: auto; }
    .reveal { opacity: 0; transform: translateY(18px); }
    .reveal.is-inview { animation: rise 0.7s ease forwards; }
    @keyframes rise { to { opacity: 1; transform: none; } }
    @media (max-width: 980px) {
      .hero-grid, .about-grid, .skills-layout, .contact-grid { grid-template-columns: 1fr; }
      .project-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 720px) {
      .nav-toggle { display: flex; }
      .nav-menu { position: absolute; top: var(--nav-h); left: 0; right: 0; background: var(--ink); flex-direction: column; padding: 1rem 1.2rem 1.4rem; gap: 0.9rem; border-bottom: 1px solid var(--line); display: none; }
      .nav-menu.is-open { display: flex; }
      .project-grid { grid-template-columns: 1fr; }
      .hero-stats { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .reveal, .bar-fill, .caret { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Primary">
      <a class="logo" href="#home"><span class="logo-mark">A</span><span>Aravindan</span></a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu" aria-label="Open menu">
        <span class="nav-toggle-bar"></span><span class="nav-toggle-bar"></span><span class="nav-toggle-bar"></span>
      </button>
      <ul class="nav-menu" id="nav-menu">
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <button class="theme-toggle" type="button" aria-label="Switch to light mode">
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5Z" stroke="currentColor" stroke-width="1.8"/></svg>
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </nav>
